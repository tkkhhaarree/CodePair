[project]
name = "codepair"
version = "0.1.0"
description = "AI developer agent + reviewer agent working as a code review pair"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pydantic",
    "python-dotenv",   # loads .env into environment variables
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]   # tools only needed while developing

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]          # only app/ is our Python package

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
